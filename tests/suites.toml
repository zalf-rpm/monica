# Test suites run by tests/run.py - see tests/README.md.
#
# Each suite is a directory with a monica-test.toml manifest (which simulations
# to run, comparison tolerances). It is either part of this repository (`path`)
# or a separate scenario repository pinned to a commit (`git` + `rev`), so a
# MONICA commit always tests against the same scenarios.

[[suite]]
name = "hohenfinow2"
path = "installer/Hohenfinow2"

[[suite]]
name = "muencheberg_v140"
git = "https://github.com/zalf-rpm/muencheberg_v140.git"
rev = "e10a7c3e6a774accf8753d958d3877e244a82ccf"

[[suite]]
name = "microlysimeter"
git = "https://github.com/zalf-rpm/microlysimeter.git"
rev = "7bbc313173a9335d5eca34f4ce5ac65103fd6730"
