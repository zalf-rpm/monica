# The setup-free builds from the README - pixi on Linux and Windows, Nix, and
# the Docker image built from it - each running the test suites
# (tests/suites.toml). The compare job then checks that all of them give the
# same results as the Nix build, which is what the Docker image ships, and the
# validate job compares the simulations with measurements (tests/validate.py).
name: Build and test

on:
  push:
    paths-ignore:
      - "**.md"
      - "documentation/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "documentation/**"
  workflow_dispatch:

jobs:
  pixi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # build.py then clones vcpkg at vcpkg_tag.txt into .vcpkg/ - the pinned
      # version, not whatever checkout the runner image happens to have.
      VCPKG_ROOT: ""
      ENGINE: pixi-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: monica

      # vcpkg's binary cache. vcpkg keys every package on its full ABI itself,
      # so a stale cache only means rebuilding what changed.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\vcpkg\archives' || '~/.cache/vcpkg/archives' }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('monica/cmake/vcpkg/vcpkg.json', 'monica/vcpkg_tag.txt', 'monica/pixi.lock') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          manifest-path: monica/pixi.toml

      - name: Build
        working-directory: monica
        run: pixi run build

      - name: Test suites
        shell: bash
        working-directory: monica
        run: |
          exe=_cmake_release/monica-run
          [ "$RUNNER_OS" = Windows ] && exe=_cmake_release/monica-run.exe
          pixi run test --monica "$exe" --engine "$ENGINE" --out ../results

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: results-${{ env.ENGINE }}
          path: results
          retention-days: 14

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: monica

      - uses: cachix/install-nix-action@v31.11.2

      - name: nix build
        working-directory: monica
        run: nix build -L

      - name: Test suites
        working-directory: monica
        run: python3 tests/run.py --monica result/bin/monica-run --engine nix-linux --out ../results

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: results-nix-linux
          path: results
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the Dockerfile builds the checkout, incl. mas_cpp_misc and monica-parameters
          submodules: recursive
          path: monica

      - name: Build the Docker image
        working-directory: monica
        run: docker build --tag monica:ci .

      - name: Test suites
        working-directory: monica
        env:
          MONICA_IMAGE: monica:ci
        run: python3 tests/run.py --monica tests/docker-monica-run.sh --engine docker --out ../results

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: results-docker
          path: results
          retention-days: 14

  compare:
    needs: [pixi, nix, docker]
    # also compare what there is when one of the builds failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests

      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results

      - name: Compare with the Nix build
        run: |
          ref=results/results-nix-linux
          [ -d "$ref" ] || { echo "::error::no results from the Nix build"; exit 1; }
          status=0
          for r in results/results-*; do
            [ "$r" = "$ref" ] && continue
            python3 tests/compare.py "$ref" "$r" || status=1
          done
          exit $status

  # Simulated vs measured (tests/validate.py) for the suites with measurements,
  # from the Nix build's results (all builds give the same). Information only,
  # it doesn't fail the build: statistics on the run page, with the change of
  # the RMSE since the previous master build; plots in the report artifact.
  validate:
    needs: nix
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read  # the previous master build's validation.json
      contents: read
    env:
      # master pushes and tags are published to zalf-rpm/monica_validation
      # (GitHub Pages: statistics over time), if the deploy key is set up
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && secrets.VALIDATION_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: validate

      - uses: actions/download-artifact@v8
        with:
          name: results-nix-linux
          path: results

      - name: Baseline from the previous master build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list -R "$GITHUB_REPOSITORY" -w build.yml -b master -e push -L 20 \
                   --json databaseId,headSha --jq ".[] | select(.headSha != \"$GITHUB_SHA\") | .databaseId")
          for id in $runs; do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n validation-json -D baseline 2>/dev/null \
              && { echo "baseline: run $id"; break; }
          done
          true

      - name: Simulated vs measured
        run: pixi run -e validate validate results --out validation --baseline baseline/validation.json --summary ''

      - uses: actions/upload-artifact@v7
        with:
          name: validation-json
          path: validation/validation.json
          retention-days: 90

      # everything, for the release-results job
      - uses: actions/upload-artifact@v7
        with:
          name: validation
          path: validation
          retention-days: 14

      # not zipped, so it is a single HTML file with the plots
      - uses: actions/upload-artifact@v7
        id: report
        with:
          path: validation/report.html
          archive: false
          retention-days: 30

      - name: Run page summary
        run: |
          {
            echo "**Plots:** [report.html](${{ steps.report.outputs.artifact-url }}) (simulation as lines, measurements as dots)"
            echo
            cat validation/report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: env.PUBLISH == 'true'
        with:
          repository: zalf-rpm/monica_validation
          ssh-key: ${{ secrets.VALIDATION_DEPLOY_KEY }}
          path: site

      - name: Publish to zalf-rpm/monica_validation
        if: env.PUBLISH == 'true'
        working-directory: site
        env:
          DATE: ${{ github.event.head_commit.timestamp }}
          MESSAGE: ${{ github.event.head_commit.message }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          git config user.name "monica CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # another run may have pushed meanwhile: then start again from its state
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main && git reset --quiet --hard origin/main
            python3 update.py --validation ../validation --commit "$GITHUB_SHA" \
              --date "${DATE:-$(date -u +%FT%TZ)}" --message "$MESSAGE" ${TAG:+--tag "$TAG"}
            git add -A
            git diff --cached --quiet && break  # e.g. a rerun: nothing new
            git commit --quiet -m "MONICA ${GITHUB_SHA::10}${TAG:+ ($TAG)}: ${MESSAGE%%$'\n'*}"
            git push --quiet origin HEAD:main && break
            [ "$attempt" = 5 ] && { echo "::error::could not push to monica_validation"; exit 1; }
            sleep $((attempt * 5))
          done
          echo "**Over time:** https://zalf-rpm.github.io/monica_validation/" >> "$GITHUB_STEP_SUMMARY"

  # For tags: the Nix build's test results and the validation report as an
  # asset of the release, e.g. to compare a later version with it
  # (tests/compare.py, deviation.py, validate.py --baseline). The release may
  # not exist yet (on-tag.yml creates it too): whichever job comes first
  # creates the draft.
  release-results:
    needs: [nix, validate]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.nix.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: results-nix-linux
          path: results

      - uses: actions/download-artifact@v8
        if: needs.validate.result == 'success'
        with:
          name: validation
          path: validation

      - name: Upload to the release
        run: |
          file="monica-test-results_${TAG}.tar.xz"
          dirs=(results); [ -d validation ] && dirs+=(validation)
          tar -cJf "$file" "${dirs[@]}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "Monica $TAG" \
            || gh release view "$TAG" >/dev/null  # created by on-tag.yml meanwhile
          gh release upload "$TAG" "$file" --clobber
