# The Odin port, built every way it can be built: pixi on Linux and Windows
# (the Windows job is the only place the MSVC side gets verified), Nix, and the
# Debian Docker image. A version bump is a PR that edits odin/versions.json -
# see odin/UPDATING_VERSIONS.md - and this workflow is what tells you whether
# all of them still work.
#
# On top, the C++ MONICA's test suites (Hohenfinow2 + 48 muencheberg_v140
# simulations, tests/ in the C++ repo) run with the Odin monica-run on Linux
# and Windows, and `compare` checks the results against the C++ build pinned
# in odin/versions.json (cpp_reference) - value by value, exactly.
name: Odin

on:
  push:
    paths:
      - "odin/**"
      - "docker/**"
      - "mas_cpp_misc"   # submodule pointer: cr_math (CORE-MATH) is built from it
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/odin.yml"
      - "src/**"          # TEMPORARY: the converted C++ (cpp-src job)
      - "CMakeLists.txt"
      - "cmake/**"
  pull_request:
    paths:
      - "odin/**"
      - "docker/**"
      - "mas_cpp_misc"   # submodule pointer: cr_math (CORE-MATH) is built from it
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/odin.yml"
      - "src/**"          # TEMPORARY: the converted C++ (cpp-src job)
      - "CMakeLists.txt"
      - "cmake/**"
  workflow_dispatch:

jobs:
  # The C++ results to compare against: the pinned C++ commit, built with Nix
  # and run on its own suites. Cached per commit - the same commit always
  # gives the same results.
  cpp-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: odin/versions.json
          sparse-checkout-cone-mode: false
          path: monica

      - name: Pinned C++ commit
        id: ref
        run: echo "commit=$(jq -r .cpp_reference.commit monica/odin/versions.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: cache
        with:
          path: cpp-results
          key: cpp-reference-${{ steps.ref.outputs.commit }}

      - uses: actions/checkout@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ref: ${{ steps.ref.outputs.commit }}
          submodules: recursive
          path: cpp

      - uses: cachix/install-nix-action@v31.11.2
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Build the C++ MONICA and run its suites
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          (cd cpp && nix build -L)
          python3 cpp/tests/run.py --monica cpp/result/bin/monica-run \
            --engine "cpp-${{ steps.ref.outputs.commit }}" --out cpp-results

      - uses: actions/upload-artifact@v7
        with:
          name: suite-cpp-reference
          path: cpp-results

  pixi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: monica

      # Full history: the manifest's builtin-baseline is a commit that must be
      # reachable, and check-pins reads the versions database.
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          fetch-depth: 0
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else ./vcpkg/bootstrap-vcpkg.sh -disableMetrics; fi

      # vcpkg's binary cache. vcpkg keys each package on its full ABI (triplet,
      # toolchain, port version) itself, so restoring a stale cache is safe -
      # it just rebuilds what changed.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\vcpkg\archives' || '~/.cache/vcpkg/archives' }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('monica/odin/versions.json', 'monica/odin/tools/odinw.py') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          manifest-path: monica/odin/pixi.toml

      - name: Check pins
        working-directory: monica/odin
        run: pixi run python tools/odinw.py check-pins

      - name: Build the Cap'n Proto shim
        working-directory: monica/odin
        run: pixi run capnp-shim

      - name: Build
        working-directory: monica/odin
        run: pixi run build

      - name: Test
        working-directory: monica/odin
        run: pixi run test

      # The C++ repo at the pinned commit, for its tests/ (run.py, the suite
      # definitions) and its monica-parameters submodule.
      - name: Pinned C++ commit
        id: ref
        shell: bash
        run: echo "commit=$(jq -r .cpp_reference.commit monica/odin/versions.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.commit }}
          submodules: true
          path: cpp

      - name: Run the C++ test suites with the Odin monica-run
        shell: bash
        run: |
          exe="$GITHUB_WORKSPACE/monica/odin/build/monica-run"
          [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          cd monica/odin
          pixi run python "$GITHUB_WORKSPACE/cpp/tests/run.py" --monica "$exe" \
            --engine "odin-$RUNNER_OS" --out "$GITHUB_WORKSPACE/odin-results"

      - uses: actions/upload-artifact@v7
        with:
          name: suite-odin-${{ runner.os }}
          path: odin-results

      # Crop2ML modules (plan-crop2ml-modules.md): amei/ must be exactly what the
      # pinned PyCrop2ML generates from the pinned Crop2ML packages, and the
      # modules must give their generated Python's numbers (tests/check_modules.sh).
      - name: Crop2ML modules
        if: runner.os == 'Linux'
        working-directory: monica/odin
        run: |
          pixi run gen-amei
          if [ -n "$(git status --porcelain -- amei)" ]; then
            git status --short -- amei
            echo "::error::odin/amei/ differs from what 'pixi run gen-amei' generates"
            exit 1
          fi
          MONICA_PARAMETERS="$GITHUB_WORKSPACE/cpp/monica-parameters" pixi run bash tests/check_modules.sh

      # Windows only: the single-binary release variant (static shim). Its
      # combined lib is MSVC-only, see support/capnp/shim_dynamic/CMakeLists.txt.
      - name: Build standalone monica-capnp-server
        if: runner.os == 'Windows'
        working-directory: monica/odin
        run: |
          pixi run capnp-shim-static
          pixi run build-standalone

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31.11.2
      - name: nix build
        run: nix build .#monica-odin -L
      - name: Smoke test
        run: ./result/bin/monica-zmq-server -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build the image
        run: docker build -f odin/Dockerfile -t monica-odin:ci .
      - name: Smoke test
        run: docker run --rm monica-odin:ci /run/monica/monica-zmq-server -v

  # TEMPORARY: the converted C++ in src/ (the transformation's intermediate,
  # still a reference for open tasks), checked to stay in sync with the
  # original C++ and the Odin port. Remove this job, its comparison in
  # `compare`, the "src/**"/CMakeLists.txt/cmake paths above, flake.nix's
  # monica-cpp-src and cmake/compat/ once the move to Odin is complete.
  cpp-src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: monica

      - name: Pinned C++ commit
        id: ref
        run: echo "commit=$(jq -r .cpp_reference.commit monica/odin/versions.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.commit }}
          submodules: true
          path: cpp

      - uses: cachix/install-nix-action@v31.11.2

      - name: Build the converted C++ and run the suites
        run: |
          (cd monica && nix build .#monica-cpp-src -L)
          python3 cpp/tests/run.py --monica monica/result/bin/monica-run \
            --engine cpp-src --out cpp-src-results

      - uses: actions/upload-artifact@v7
        with:
          name: suite-cpp-src
          path: cpp-src-results

  # Odin (Linux, Windows) vs. the C++ reference, exactly; the report goes to
  # the job summary. Simulations of features the port lacks are skipped
  # (cpp_reference.ignore in odin/versions.json).
  compare:
    needs: [cpp-reference, pixi, cpp-src]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: odin/versions.json
          sparse-checkout-cone-mode: false
          path: monica

      - name: Pinned C++ commit
        id: ref
        run: |
          {
            echo "commit=$(jq -r .cpp_reference.commit monica/odin/versions.json)"
            echo "ignore=$(jq -r '.cpp_reference.ignore | join(" ")' monica/odin/versions.json)"
            echo "ignore_src=$(jq -r '.cpp_reference.ignore_src | join(" ")' monica/odin/versions.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.commit }}
          sparse-checkout: tests
          path: cpp

      - uses: actions/download-artifact@v8
        with:
          pattern: suite-*

      - name: Compare
        run: |
          status=0
          for os in Linux Windows; do
            python3 cpp/tests/compare.py suite-cpp-reference "suite-odin-$os" \
              ${{ steps.ref.outputs.ignore && format('--ignore {0}', steps.ref.outputs.ignore) }} || status=1
          done
          # TEMPORARY: the converted C++ (cpp-src job)
          python3 cpp/tests/compare.py suite-cpp-reference suite-cpp-src \
            ${{ steps.ref.outputs.ignore_src && format('--ignore {0}', steps.ref.outputs.ignore_src) }} || status=1
          exit $status
