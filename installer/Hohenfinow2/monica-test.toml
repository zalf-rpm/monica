# Test manifest for tests/run.py - see tests/README.md.
# sim-ser.json isn't included: it writes its state to a hardcoded C:/tmp path.
# sim-min-nmin.json: sim-min.json with the automatic N-min fertilisation and
# NFert/SumNFert outputs - the only coverage of both outside intercropping.
# sim-min-co2.json, sim-min-warmer.json: sim-min.json with a second climate file
# merged in (DataAccessor::mergeClimateData) - one adding a co2 column, one
# replacing tavg/tmin/tmax for 1993-1994 only.
sims = ["sim.json", "sim+.json", "sim-min.json", "sim-min-ic.json", "sim-min-nmin.json",
        "sim-min-co2.json", "sim-min-warmer.json"]

[compare]
# exact equality unless a column below says otherwise
default = { atol = 0.0, rtol = 0.0 }
